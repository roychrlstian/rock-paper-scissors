<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>

</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="choices">
            <button class="rock">
                <img src="images/rock.svg" alt="Rock">
                Rock
            </button>
            <button class="paper">
                <img src="images/paper.svg" alt="Paper">
                Paper
            </button>
            <button class="scissors">
                <img src="images/scissors.svg" alt="Scissors">
                Scissors
            </button>
        </div>
        <div class="gameResult">---</div>
        <div>
            <p>Player Score: <span class="playerScore">0</span></p>
            <p>Computer Score: <span class="computerScore">0</span></p>
        </div>
        <button class="restart">Restart</button>
    </div>
